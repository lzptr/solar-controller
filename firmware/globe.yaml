# One globe: an RGBW light in Home Assistant that only stores the globe's colour.
# The main light's "Planets" effect paints each globe's 7 LEDs with it, scaled by
# the main brightness. Included once per globe from solar-controller.yaml with:
#   index        0-9, inner to outer (Sun first, Pluto last)
#   planet       entity name
#   cb, r, g, b  colour brightness and normalised RGB (max channel = 1)
#   w            white channel
# An RGBW value {R, G, B, W} becomes cb = max(R, G, B) / 255, r = R / max(R, G, B)
# and so on, w = W / 255, so the defaults match the firmware's planet table exactly.

output:
  - platform: template
    id: globe_${index}_red
    type: float
    write_action:
      - lambda: id(globe_colour)[${index} * 4 + 0] = state;
  - platform: template
    id: globe_${index}_green
    type: float
    write_action:
      - lambda: id(globe_colour)[${index} * 4 + 1] = state;
  - platform: template
    id: globe_${index}_blue
    type: float
    write_action:
      - lambda: id(globe_colour)[${index} * 4 + 2] = state;
  - platform: template
    id: globe_${index}_white
    type: float
    write_action:
      - lambda: id(globe_colour)[${index} * 4 + 3] = state;

light:
  - platform: rgbw
    id: globe_${index}
    name: ${planet}
    icon: mdi:circle-slice-8
    red: globe_${index}_red
    green: globe_${index}_green
    blue: globe_${index}_blue
    white: globe_${index}_white
    color_interlock: false
    # Linear, like the main light, so the stored value is the colour sent out.
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    initial_state:
      color_mode: RGB_WHITE
      brightness: 100%
      color_brightness: ${cb}
      red: ${r}
      green: ${g}
      blue: ${b}
      white: ${w}
